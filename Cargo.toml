[workspace]
resolver = "2"
members = [
    "crates/panopticon-core",
    "crates/panopticon-schema",
    # "crates/panopticon-m365",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/dolly-parseton/panopticon"
authors = ["dolly-parseton"]

[workspace.dependencies]
panopticon-core = { path = "crates/panopticon-core", version = "0.3" }
# panopticon-m365 = { path = "crates/panopticon-m365", version = "0.1" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
